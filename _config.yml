# Site settings
title: Junteng Liu
email: jliugi@connect.ust.hk
description: >- # this means to ignore newlines until "baseurl:"
  Personal homepage of Junteng Liu, first-year PhD candidate at HKUST NLP Group.
  Research interests include LLM Reasoning and Reinforcement Learning, Hallucination
  in Vision-Language Models, and LLM Truthfulness and Interpretability.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://d0941n7.github.io" # the base hostname & protocol for your site
twitter_username: junteng88716710
github_username: Vicent0205

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Analytics and webmaster tools
google_analytics:
bing_tracker:
alexa_tracker:

# Output options (more information on Jekyll's site)
timezone: Asia/Hong_Kong
kramdown:
  input: GFM

# Pagination
paginate: 5

# Personal info of the site author
author:
  name: Junteng Liu
  avatar: bio-photo.jpg
  bio: "First-year PhD candidate at HKUST NLP Group, advised by Prof. Junxian He. Research focuses on natural language processing and machine learning."
  affiliation: Hong Kong University of Science and Technology
  location: Hong Kong
  email: jliugi@connect.ust.hk
  github: Vicent0205
  twitter: junteng88716710
  google_scholar: https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate

# Social link icons in the footer
social:
  - icon: "fab fa-google"
    url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  - icon: "fab fa-github"
    url: "https://github.com/Vicent0205"
  - icon: "fab fa-x-twitter"
    url: "https://x.com/junteng88716710"
  - icon: "fas fa-envelope"
    url: "mailto:jliugi@connect.ust.hk"

# Navigation links
navbar-links:
  About Me: "about/"
  Publications: "publications/"

# Use the following plug-ins
plugins:
  - jekyll-paginate
  - jekyll-sitemap

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yaml
  - package.json
  - vendor

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "publication"
